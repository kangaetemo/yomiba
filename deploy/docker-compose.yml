# Yomiba on the VPS: Caddy (HTTPS) -> Next.js -> FastAPI. The backend is
# reachable only inside this network (the browser goes through the frontend's
# same-origin /api rewrite).
#
# The server's host Caddy (shared with Filminibul) owns 80/443 and proxies
# yomiba.net to the frontend on 127.0.0.1:FRONTEND_PORT (see yomiba.caddy).
# On a server without one, start the bundled Caddy instead:
#   docker compose --profile caddy up -d
#
#   cd deploy && cp .env.example .env   # fill in, then:
#   docker compose up -d --build

name: yomiba

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/yomiba.db
    volumes:
      - ${DATA_DIR:-/srv/yomiba/data}:/data
    # Let in-flight imports and SQLite writes finish on restart.
    stop_grace_period: 60s
    logging: *logging

  frontend:
    build:
      context: ../frontend
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-yomiba.net}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    logging: *logging

  # Off-site backup to Cloudflare R2 (deploy/r2.env). Enabled with
  # COMPOSE_PROFILES=r2 in .env once r2.env is filled in.
  litestream:
    image: litestream/litestream:0.3.13
    profiles: ["r2"]
    restart: unless-stopped
    # Same uid as the backend: Litestream writes yomiba.db-litestream/ and
    # takes over WAL checkpoints next to the DB.
    user: "10001:10001"
    command: replicate
    env_file:
      - path: r2.env
        required: false
    volumes:
      - ./litestream.yml:/etc/litestream.yml:ro
      - ${DATA_DIR:-/srv/yomiba/data}:/data
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

  # One-shot copies run by yedekle.sh (nightly backups and covers to R2).
  rclone:
    image: rclone/rclone:1.68.2
    profiles: ["tools"]
    env_file:
      - path: r2.env
        required: false
    environment:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      # A bucket-scoped token may not list or create buckets.
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    volumes:
      - ${DATA_DIR:-/srv/yomiba/data}/covers:/covers:ro
      - ${BACKUP_DIR:-/srv/yomiba/backups}:/backups:ro
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
