name: Deploy

# Runs deploy/guncelle.sh on the VPS over SSH: after "Application checks"
# passes on main, weekly (fresh base images), or by hand. The server moves to
# exactly the commit whose checks passed, never a newer one; weekly and manual
# runs use the newest main commit with passing checks. The key in
# DEPLOY_SSH_KEY is pinned on the server to that one script.
on:
  workflow_run:
    workflows: ["Application checks"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "30 1 * * 1" # Monday 04:30 Istanbul
  workflow_dispatch:

permissions:
  actions: read # find the last passing "Application checks" run

concurrency:
  group: deploy-vds
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pick the tested commit
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="$RUN_SHA"
          if [ -z "$sha" ]; then
            sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty')"
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::No main commit with passing Application checks found."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha"
      - name: Run guncelle.sh on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning::Deploy secrets are not set; skipping."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server's forced command reads "deploy <sha>" from
          # SSH_ORIGINAL_COMMAND; -T: no terminal.
          set -o pipefail
          ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "root@$HOST" "deploy $SHA" | tee deploy.log
          # guncelle.sh prints the commit its running containers were built from.
          if grep -qx "DEPLOY_SHA=$SHA" deploy.log; then
            echo "Deployed and verified: $SHA" >> "$GITHUB_STEP_SUMMARY"
          elif grep -q '^DEPLOY_ATLANDI=' deploy.log; then
            echo "Skipped: the server already runs a newer commit ($(sed -n 's/^DEPLOY_ATLANDI=//p' deploy.log))." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::The server did not confirm it is running $SHA."
            exit 1
          fi
